[project]
name = "matchmaker"
version = "0.1.0"
description = "Event matchmaking prototype: Jev-precomputed preferences, live Gale-Shapley pool refresh"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135",
    "uvicorn>=0.40",
    "sqlalchemy>=2.0.40,<2.2",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "pydantic-settings>=2.10",
    "typesafe-sdk==0.7.4",
]

[dependency-groups]
dev = ["pytest>=8.4", "hypothesis>=6.140", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matchmaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
